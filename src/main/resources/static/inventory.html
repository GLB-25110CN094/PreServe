<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PreServe</title><link rel="stylesheet" href="style.css"></head><body><main><div class="row"><h1 class="sp" data-i18n="i_title"></h1><input id="q" data-ph="i_search"><select id="fc"></select><select id="fr"></select>
<button class="btn sec" id="imp" data-i18n="i_import"></button><button class="btn" id="add" data-i18n="i_add"></button></div>
<div class="card wrap"><table id="tb"></table></div></main>
<script src="app.js"></script><script>
let D=[];const RK=['LOW','MEDIUM','HIGH','VERY_HIGH','NONE'];
function opts(){fc.innerHTML='<option value="">'+t('i_cat')+': '+t('i_all')+'</option>'+CATS.map(c=>'<option value="'+c+'">'+catName(c)+'</option>').join('');fr.innerHTML='<option value="">'+t('i_risk')+': '+t('i_all')+'</option>'+RK.map(c=>'<option value="'+c+'">'+t(c)+'</option>').join('')}
function render(){const s=q.value.toLowerCase();const L=D.filter(a=>a.name.toLowerCase().includes(s)&&(!fc.value||a.category===fc.value)&&(!fr.value||a.risk===fr.value));
tb.innerHTML='<tr><th>#</th><th data-i18n="nav_inventory"></th><th data-i18n="i_cat"></th><th data-i18n="i_price"></th><th data-i18n="i_stock"></th><th data-i18n="i_left"></th><th data-i18n="i_avg"></th><th data-i18n="i_leftover"></th><th data-i18n="i_sell"></th><th data-i18n="i_risk"></th><th></th></tr>'+
L.map((a,i)=>'<tr><td>'+(i+1)+'</td><td><a href="product.html?id='+a.id+'">'+esc(a.name)+'</a></td><td>'+catName(a.category)+'</td><td>'+a.price+'</td><td>'+a.stock+'</td><td>'+(a.daysToExpiry??'-')+'</td><td>'+a.avgDaily+'</td><td>'+a.leftover+'</td><td>'+(a.sellOutDays>0&&a.sellOutDays<120?a.sellOutDays+' '+t('days'):'120+')+'</td><td>'+badge(a.risk)+'</td><td style="white-space:nowrap"><button class="btn sm sec" onclick="stockM('+a.id+')" data-i18n="i_addstock"></button> <button class="btn sm sec" onclick="saleM('+a.id+')" data-i18n="i_sale"></button></td></tr>').join('');applyI18n(tb)}
async function load(){D=await api('/inventory?shopId='+shopId());render()}
function exp(d){const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
add.onclick=()=>{const m=modal('<h2 data-i18n="i_add"></h2><div class="f2"><div><label data-i18n="name"></label><input id="pn"></div><div><label data-i18n="i_cat"></label><select id="pc">'+CATS.map(c=>'<option value="'+c+'">'+catName(c)+'</option>').join('')+'</select></div><div><label data-i18n="i_price"></label><input id="pp" type="number" min="0"></div><div><label data-i18n="i_qty"></label><input id="pq" type="number" min="1"></div><div><label data-i18n="i_exp"></label><input id="pe" type="date" value="'+exp(14)+'"></div><div><label data-i18n="i_est"></label><input id="pd" type="number" min="0"></div></div><button class="btn" id="ok" data-i18n="save"></button>');
m.querySelector('#ok').onclick=async()=>{try{const a=await api('/products',{shopId:shopId(),name:pn.value,category:pc.value,price:pp.value,quantity:pq.value,expiryDate:pe.value,estDaily:pd.value});m.remove();evalM(a);load()}catch(x){toast(x.message,1)}}};
function evalM(a){const m=modal('<h3 data-i18n="i_eval"></h3>'+evalHtml(a)+'<br><a class="btn" href="product.html?id='+a.id+'" data-i18n="view"></a> <button class="btn sec" onclick="this.closest(\'.modal\').remove()" data-i18n="close"></button>')}
function stockM(id){const m=modal('<h2 data-i18n="i_addstock"></h2><label data-i18n="i_qty"></label><input id="sq" type="number" min="1"><label data-i18n="i_exp"></label><input id="se" type="date" value="'+exp(14)+'"><br><button class="btn" id="ok" data-i18n="save"></button>');
m.querySelector('#ok').onclick=async()=>{try{const a=await api('/stock',{productId:id,quantity:sq.value,expiryDate:se.value});m.remove();evalM(a);load()}catch(x){toast(x.message,1)}}}
function saleM(id){const m=modal('<h2 data-i18n="i_sale"></h2><label data-i18n="i_qty"></label><input id="uq" type="number" min="1"><label data-i18n="i_date"></label><input id="ud" type="date" value="'+exp(0)+'"><label><input id="up" type="checkbox"> <span data-i18n="i_promo"></span></label><br><br><button class="btn" id="ok" data-i18n="save"></button>');
m.querySelector('#ok').onclick=async()=>{try{await api('/sales',{productId:id,units:uq.value,date:ud.value,promo:up.checked});m.remove();load()}catch(x){toast(x.message,1)}}}
imp.onclick=()=>{const m=modal('<h2 data-i18n="i_import"></h2><p class="mut" data-i18n="i_csvhelp"></p><input type="file" id="fl" accept=".csv"><br><br><button class="btn" id="ok" data-i18n="save"></button>');
m.querySelector('#ok').onclick=async()=>{try{const f=fl.files[0];if(!f)return;const r=await api('/products/import',{shopId:shopId(),csv:await f.text()});m.remove();toast(t('i_imported',{n:r.imported})+(r.errors.length?' ('+r.errors.length+' errors)':''),r.errors.length>0);load()}catch(x){toast(x.message,1)}}};
if(shell('inventory')){opts();[q,fc,fr].forEach(e=>e.oninput=render);load().catch(e=>toast(e.message,1))}</script></body></html>

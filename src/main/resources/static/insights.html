<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PreServe</title><link rel="stylesheet" href="style.css"></head><body><main><h1 data-i18n="n_title"></h1><p class="mut" data-i18n="n_sub"></p><div class="row"><select id="cs"></select></div><div class="card"><canvas id="c"></canvas></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script><script>
let D,ch;const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function draw(){if(ch)ch.destroy();const c=cs.value,tx=css('--tx'),gr=css('--bd');const real=new Array(12).fill(null);
const rs=D.actual.filter(r=>r.category===c);const avg=rs.reduce((s,r)=>s+r.avg_units,0)/(rs.length||1);rs.forEach(r=>real[r.m-1]=Math.round(r.avg_units/avg*100)/100);
ch=new Chart(document.getElementById('c'),{data:{labels:MN,datasets:[{type:'line',label:t('n_idx'),data:D.seasonality[c],borderColor:'#1f8a4c',tension:.3,backgroundColor:'#1f8a4c'},{type:'bar',label:t('n_real')+' (rel.)',data:real,backgroundColor:'#8b5cf6'}]},
options:{scales:{x:{ticks:{color:tx},grid:{color:gr}},y:{ticks:{color:tx},grid:{color:gr},min:0}},plugins:{legend:{labels:{color:tx}},title:{display:true,color:tx,text:t('n_now')+': '+MN[D.month-1]}}}})}
if(shell('insights'))(async()=>{D=await api('/insights?shopId='+shopId());cs.innerHTML=Object.keys(D.seasonality).map(c=>'<option value="'+c+'">'+catName(c)+'</option>').join('');cs.onchange=draw;draw();window.onTheme=draw})().catch(e=>toast(e.message,1))</script></body></html>

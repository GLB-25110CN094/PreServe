<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PreServe</title><link rel="stylesheet" href="style.css"></head><body><main><h1 data-i18n="a_title"></h1><p class="mut" data-i18n="a_sub"></p><div class="card wrap"><table id="tb"></table></div></main>
<script src="app.js"></script><script>
async function load(){const L=await api('/interventions?shopId='+shopId());
tb.innerHTML=L.length?'<tr><th>#</th><th data-i18n="nav_inventory"></th><th data-i18n="a_type"></th><th>%</th><th>Start</th><th data-i18n="a_status"></th><th data-i18n="a_saved"></th><th data-i18n="m_kg"></th><th data-i18n="m_val"></th><th></th></tr>'+L.map(i=>'<tr><td>'+i.id+'</td><td>'+esc(i.product_name)+'</td><td>'+t(i.type)+'</td><td>'+(i.discount_pct||'-')+'</td><td>'+i.start_date+'</td><td>'+t(i.status)+'</td><td>'+(i.units_saved??'-')+'</td><td>'+(i.kg_saved??'-')+'</td><td>'+(i.value_recovered!=null?money(i.value_recovered):'-')+'</td><td>'+(i.status==='ACTIVE'?'<button class="btn sm" onclick="done('+i.id+')" data-i18n="a_complete"></button>':'')+'</td></tr>').join(''):'<tr><td data-i18n="a_none"></td></tr>';applyI18n(tb)}
function done(id){const m=modal('<h2 data-i18n="a_complete"></h2><label data-i18n="a_sold"></label><input id="us" type="number" min="0" placeholder="auto"><br><br><button class="btn" id="ok" data-i18n="save"></button>');
m.querySelector('#ok').onclick=async()=>{try{await api('/interventions/'+id+'/complete',us.value?{unitsSold:us.value}:{});m.remove();load()}catch(x){toast(x.message,1)}}}
if(shell('actions'))load().catch(e=>toast(e.message,1))</script></body></html>

server.port=${PORT:8080}
server.error.include-message=always
# ---- MySQL (default). Create nothing by hand: the DB is created automatically ----
spring.datasource.url=jdbc:mysql://localhost:3307/preserve?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
